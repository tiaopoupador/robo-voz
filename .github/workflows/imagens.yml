name: imagens (Cloudflare gratis)
# Todo dia, logo depois que a cota gratis da Cloudflare zera (00:00 UTC = 21h de Brasilia), gera as imagens
# que faltam dos videos em producao e guarda no Drive do canal (Tiao Poupador/robo/video-NN/img).
on:
  schedule:
    - cron: '20 */2 * * *'   # de 2 em 2 horas: quando a cota libera, gera; com tudo feito, nao faz nada
    # (a conta e do plano gratis: passar do limite so da erro, nunca cobra)
  workflow_dispatch:
    inputs:
      videos:
        default: ""
permissions:
  contents: read
jobs:
  imagens:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency: imagens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pillow anthropic
      - name: abrir o cofre (banco do canal, cifrado)
        env:
          VOZ_SENHA: ${{ secrets.VOZ_SENHA }}
        run: cat cofre/banco.enc.* | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:VOZ_SENHA | tar -xf - banco/referencia
      - name: mandar os pedidos ao Ed (Apexi Team, uma vez por video; e-mail de reserva)
        env:
          APEXI_TEAM_CHAVE: ${{ secrets.APEXI_TEAM_CHAVE }}
          YT_ID: ${{ secrets.YT_ID }}
          YT_SEGREDO: ${{ secrets.YT_SEGREDO }}
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
        run: |
          mkdir -p fabrica/saida
          for NN in $(python fabrica/agenda.py em_producao); do python fabrica/pedidos.py $NN --enviar || echo "pedidos $NN falhou"; done
      - name: gerar
        env:
          CLOUDFLARE_TIAO: ${{ secrets.CLOUDFLARE_TIAO }}
          CLOUDFLARE_TIAO_CONTA: ${{ secrets.CLOUDFLARE_TIAO_CONTA }}
          CLAUDE_TIAO: ${{ secrets.CLAUDE_TIAO }}
          YT_ID: ${{ secrets.YT_ID }}
          YT_SEGREDO: ${{ secrets.YT_SEGREDO }}
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
        run: |
          mkdir -p fabrica/saida
          VIDS="${{ inputs.videos }}"
          [ -z "$VIDS" ] && VIDS=$(python fabrica/agenda.py em_producao)
          for NN in $VIDS; do echo "== video $NN"; python fabrica/imagens.py $NN --drive; done
