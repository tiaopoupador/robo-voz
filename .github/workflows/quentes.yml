name: quentes (as noticias do dia para o Plantao do Tiao)
# Todo dia 10:00 UTC (7h de Brasilia). Ed, 25/11/2026: «Sim» ao buscador diario. Gratis: YouTube, Google Trends e Agencia Brasil.
# 26/11 (Ed: «nao colocar nada no Team sem a minha permissao»): a lista NAO vai mais ao Team. Fica so no registro da corrida (gh run view --log).
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quentes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          YT_ID: ${{ secrets.YT_ID }}
          YT_SEGREDO: ${{ secrets.YT_SEGREDO }}
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
          APEXI_TEAM_CHAVE: ${{ secrets.APEXI_TEAM_CHAVE }}
        run: python pesquisa/quentes.py 48
